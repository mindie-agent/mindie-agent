name: PR Checklist & LF Line-Ending Gate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-checklist:
    name: Verify LF Line Endings & Pre-PR Design Principles Checklist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce Unix LF Line Endings (Reject Windows CRLF)
        run: python3 .github/scripts/check_lf_eol.py
      - name: Verify Channel Version Sync in READMEs
        run: python3 .github/scripts/sync_org_versions.py --check --offline
      - name: Validate PR Checklist and Review Evidence
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_pr_checklist.py
