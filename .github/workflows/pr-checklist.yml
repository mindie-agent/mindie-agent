name: PR Checklist & LF Line-Ending Gate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-checklist:
    name: Verify LF Line Endings & Pre-PR Design Principles Checklist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce Unix LF Line Endings (Reject Windows CRLF)
        run: python3 .github/scripts/check_lf_eol.py
      - name: Identify product combination input changes
        id: product
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 .github/scripts/release_doc_hygiene.py --product-inputs-changed "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify Channel Version Sync in READMEs
        if: steps.product.outputs.changed == 'true'
        run: python3 .github/scripts/sync_org_versions.py --release-scope product --check --offline
      - name: Verify Automatic-Update Readiness Manifest & Schema
        if: steps.product.outputs.changed == 'true'
        run: python3 .github/scripts/check_auto_update_readiness.py --release-scope product
      - name: Read the recorded compatibility validator revision
        id: knowledge
        run: python3 -c 'import json,os; value=json.load(open("channels/0.1.json"))["components"]["knowledge"]["commit"]; open(os.environ["GITHUB_OUTPUT"],"a").write("commit="+value+"\n")'
      - name: Checkout the recorded compatibility validator
        uses: actions/checkout@v4
        with:
          repository: mindie-agent/knowledge
          ref: ${{ steps.knowledge.outputs.commit }}
          path: .ci/knowledge
          persist-credentials: false
      - name: Install compatibility validator dependencies
        run: python3 -m pip install "semantic-version==2.10.0" "PyYAML>=6.0" "packaging>=24"
      - name: Verify release scope and publication input contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci/knowledge
        run: python3 -m unittest discover -s .github/scripts/tests -p 'test_*.py'
      - name: Validate PR Checklist and Review Evidence
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_pr_checklist.py
